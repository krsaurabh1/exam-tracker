<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Schools - Mishika's 11+ Tracker</title>
  <script src="gate-init.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="access-gate" class="access-gate">
    <form id="gate-form" class="gate-card">
      <h1 class="gate-title">Mishika's 11+ Tracker</h1>
      <p class="gate-sub">Enter the password to continue.</p>
      <label for="gate-password" class="visually-hidden">Password</label>
      <input type="password" id="gate-password" autocomplete="current-password"
             placeholder="Password" required>
      <button type="submit" class="primary">Unlock</button>
      <p id="gate-error" class="error" role="alert" hidden>Incorrect password.</p>
    </form>
  </div>

  <main>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html">Dashboard</a>
      <a href="schools.html" aria-current="page">Schools</a>
      <a href="scores.html">Scores</a>
    </nav>

    <header class="page-head">
      <h1>Schools</h1>
      <div class="head-actions">
        <button type="button" id="publish" class="primary" hidden>Publish&hellip;</button>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true"></span>
          <span id="theme-label">Dark mode</span>
        </button>
      </div>
    </header>

    <p id="notice" class="notice" hidden></p>

    <section id="label-editor" class="label-editor edit-only" hidden>
      <h2 class="section-heading">Customize field names</h2>
      <p class="section-sub">These captions apply to every school card below.</p>
      <div id="label-editor-fields" class="school-meta"></div>
    </section>

    <div id="schools-list"></div>

    <div class="table-toolbar edit-only" id="add-school-toolbar" hidden>
      <button type="button" id="add-school" class="secondary">+ Add school</button>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="schools.js"></script>
</body>
</html>
